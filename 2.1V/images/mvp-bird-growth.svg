 </g>
 <!-- Stage 2: curious hatchling with shell cap -->
 <g stroke="#3E2F23" stroke-linejoin="round" stroke-linecap="round">
  <path d="M425 244c0-54 32-91 80-91 49 0 80 38 80 91 0 40-34 64-81 64-45 0-79-24-79-64Z" fill="url(#chick)" stroke-width="8"/>
  <path d="M459 170c-6-22 5-42 27-49 21-7 43 4 49 23-19-5-39 0-54 15-8 7-15 11-22 11Z" fill="#FFF2D1" stroke-width="7"/>
  <path d="M466 242c-20 9-31 24-34 42 27-2 45-11 57-28m37-12c19 10 29 24 32 42-25-2-43-10-55-27" fill="#F6B848" stroke-width="7"/>
  <circle cx="474" cy="218" r="7" fill="#3E2F23" stroke="none"/><circle cx="527" cy="218" r="7" fill="#3E2F23" stroke="none"/>
  <path d="m489 232 12 11 12-11" fill="#E77E43" stroke-width="5"/>
  <path d="M471 304v18m45-18v18" stroke-width="7"/><path d="M460 322h22m23 0h22" stroke="#E77E43" stroke-width="7"/>
  <path d="M457 196c9-9 18-12 27-10m31 0c9-2 18 1 27 10" stroke="#F7C655" stroke-width="7"/>
 </g>
