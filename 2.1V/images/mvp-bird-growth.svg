  <circle cx="847" cy="177" r="7" fill="#3E2F23" stroke="none"/>
  <path d="M894 198c-10 6-21 7-32 2" stroke="#3E2F23" stroke-width="4"/>
  <path d="M742 265c32-8 57-2 77 19-25 19-52 24-80 14m65-27c30-5 53 4 69 27-26 14-51 15-75 3" stroke="#43816D" stroke-width="7"/>
  <path d="M758 306v17m45-17v17" stroke-width="7"/><path d="M747 323h22m23 0h22" stroke="#E2A340" stroke-width="7"/>
  <path d="M704 111v-18m-9 9h18m151-57v-18m-9 9h18" stroke="#FFFDF2" stroke-width="6"/>
