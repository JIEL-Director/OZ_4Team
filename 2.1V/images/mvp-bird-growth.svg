<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" fill="none" role="img" aria-labelledby="title desc">
 <title id="title">알에서 성체 새로 자라는 MVP</title>
 <desc id="desc">MVP 아이디어가 알에서 시작해 아기새, 성체새로 성장하는 세 단계 그림</desc>
 <defs>
  <linearGradient id="shell" x1="120" y1="110" x2="245" y2="305" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF9E7"/><stop offset="1" stop-color="#F3DB9A"/></linearGradient>
  <linearGradient id="chick" x1="411" y1="141" x2="592" y2="307" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD975"/><stop offset="1" stop-color="#F5A83A"/></linearGradient>
  <linearGradient id="adult" x1="716" y1="120" x2="882" y2="308" gradientUnits="userSpaceOnUse"><stop stop-color="#A8DAD3"/><stop offset="1" stop-color="#5DA38E"/></linearGradient>
  <filter id="shadow" x="35" y="30" width="930" height="340" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="10"/></filter>
 </defs>
 <!-- Soft stage halos -->
 <ellipse cx="188" cy="337" rx="117" ry="15" fill="#161D18" opacity=".18" filter="url(#shadow)"/>
 <ellipse cx="500" cy="337" rx="117" ry="15" fill="#161D18" opacity=".18" filter="url(#shadow)"/>
 <ellipse cx="812" cy="337" rx="117" ry="15" fill="#161D18" opacity=".18" filter="url(#shadow)"/>
 <circle cx="188" cy="196" r="126" fill="#F9E9B8"/>
 <circle cx="500" cy="196" r="126" fill="#FFE59A"/>
 <circle cx="812" cy="196" r="126" fill="#D5EEE2"/>
 <!-- Progress arrows -->
 <path d="M322 189h42m-12-13 13 13-13 13M634 189h42m-12-13 13 13-13 13" stroke="#FFC233" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- Stage 1: an MVP egg, just beginning to crack -->
 <g stroke="#3E2F23" stroke-linejoin="round" stroke-linecap="round">
  <path d="M120 222c4-70 32-121 68-121 39 0 66 53 70 121 3 51-26 83-69 83-45 0-72-32-69-83Z" fill="url(#shell)" stroke-width="8"/>
  <path d="m121 226 24-12 21 15 22-13 22 15 23-14 24 13" fill="#FFF9E7" stroke-width="8"/>
  <path d="m150 255 23-12 21 15 21-12 19 12" stroke="#E2B74B" stroke-width="7"/>
  <path d="M139 167c11-32 24-47 39-55" stroke="#FFF" stroke-width="8"/>
