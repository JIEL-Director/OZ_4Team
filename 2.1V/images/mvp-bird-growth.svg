 <!-- labels -->
 <g fill="#3E2F23" font-family="Noto Sans KR,sans-serif" text-anchor="middle">
  <text x="188" y="385" font-size="22" font-weight="700">MVP 아이디어</text>
  <text x="500" y="385" font-size="22" font-weight="700">첫 검증</text>
  <text x="812" y="385" font-size="22" font-weight="700">함께 성장</text>
 </g>
</svg>
